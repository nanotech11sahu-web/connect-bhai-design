<title>Connect Bhai</title>
<meta name="description" content="Connect Bhai: compare broadband plans by PIN code in Indore and request a connection. Compare. Choose. Connect.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: sticky white header → deep-blue "fibre grid" hero with PIN search → filter rail + plan cards → partner/role
   dashboards share one shell (page head + scrollable tab strip + cards/tables). Mobile-first, single column under 900px. */
:root{
  --bg:#F4F7FD; --surface:#FFFFFF; --ink:#0A1B3D; --muted:#53617F; --line:#DCE4F2; --line-strong:#C3D0E8;
  --blue:#1450E6; --blue-ink:#FFFFFF; --blue-deep:#0A2A78; --blue-soft:#E8EFFF; --sky:#8DB4FF;
  --ok:#11804A; --ok-soft:#E2F5EA; --warn:#9A5800; --warn-soft:#FFF1DA; --bad:#B42318; --bad-soft:#FDE8E6;
  --display:"Sora","Manrope",system-ui,sans-serif; --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px; --shadow:0 1px 2px rgba(10,27,61,.06),0 8px 24px -12px rgba(10,27,61,.18);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#060E20; --surface:#0D1830; --ink:#E6EDFF; --muted:#9AA9C9; --line:#1C2B4D; --line-strong:#2A3D66;
  --blue:#4F86FF; --blue-ink:#03102E; --blue-deep:#071A4A; --blue-soft:#12244A; --sky:#8DB4FF;
  --ok:#43C985; --ok-soft:#0F2E20; --warn:#F2B356; --warn-soft:#33240A; --bad:#FF8A7E; --bad-soft:#3A1512;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060E20; --surface:#0D1830; --ink:#E6EDFF; --muted:#9AA9C9; --line:#1C2B4D; --line-strong:#2A3D66;
  --blue:#4F86FF; --blue-ink:#03102E; --blue-deep:#071A4A; --blue-soft:#12244A; --sky:#8DB4FF;
  --ok:#43C985; --ok-soft:#0F2E20; --warn:#F2B356; --warn-soft:#33240A; --bad:#FF8A7E; --bad-soft:#3A1512;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%}
a{color:var(--blue)}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
.mono{font-family:var(--mono);font-size:.92em;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1.5px solid transparent;padding:11px 18px;font-weight:700;font-size:15px;line-height:1.1;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s,transform .1s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--blue);color:var(--blue-ink)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.btn-ghost:hover{border-color:var(--blue)}
.btn-soft{background:var(--blue-soft);color:var(--blue)}
.btn-danger{background:var(--bad-soft);color:var(--bad)}
.btn-sm{padding:7px 12px;font-size:13.5px;border-radius:8px}
.btn-block{width:100%}
.linkbtn{background:none;border:0;padding:0;color:var(--blue);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.02em;background:none;border:0;cursor:pointer;padding:0}
.brand b{color:var(--blue)}
.brand svg{flex:none}
.topnav{display:flex;gap:4px;margin-left:12px}
.topnav button{background:none;border:0;padding:8px 12px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer}
.topnav button:hover,.topnav button[aria-current="page"]{color:var(--ink);background:var(--blue-soft)}
.top .acts{margin-left:auto;display:flex;gap:8px;align-items:center}
.who{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--blue);color:var(--blue-ink);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.rolechip{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--blue-soft);color:var(--blue)}

@media (max-width:900px){.topnav{display:none}.who .nm{display:none}}
@media (max-width:600px){.who .rolechip{display:none}.top .acts .btn-sm{padding:7px 10px}.brand{font-size:19px}}

.demobar{background:var(--blue-deep);color:#DCE7FF;font-size:13px}

.demobar b{color:#fff}
.demobar .linkbtn{color:#fff;font-size:13px}

/* hero */
.hero{background:var(--blue-deep);color:#fff;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;opacity:.35;pointer-events:none;
  background-image:linear-gradient(rgba(141,180,255,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(141,180,255,.22) 1px,transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(ellipse at 70% 30%,#000 10%,transparent 70%)}
.hero::after{content:"";position:absolute;left:-10%;right:-10%;bottom:0;height:2px;background:linear-gradient(90deg,transparent,#8DB4FF,transparent);opacity:.7;animation:pulse 4s linear infinite;pointer-events:none}
@keyframes pulse{0%{transform:translateX(-30%)}100%{transform:translateX(30%)}}
@media (prefers-reduced-motion:reduce){.hero::after{animation:none}}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;padding-block:44px 52px;align-items:center}
@media (max-width:900px){.hero .wrap{grid-template-columns:1fr;padding-block:36px 40px;gap:24px}}
.hero .eyebrow{color:var(--sky)}
.hero h1{font-size:clamp(36px,6vw,62px);font-weight:800;margin:10px 0 14px;color:#fff}
.hero h1 span{display:block;color:var(--sky)}
.hero .lede{font-size:18px;color:#C9D8FF;max-width:52ch}
.trust{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:22px;font-size:14px;color:#C9D8FF}
.trust span{display:inline-flex;align-items:center;gap:7px}
.trust i{width:6px;height:6px;border-radius:50%;background:var(--sky)}
.search{background:var(--surface);color:var(--ink);border-radius:18px;padding:18px 20px;box-shadow:0 30px 60px -30px rgba(0,0,0,.55);margin-top:22px}
.hero-link{background:transparent!important;color:#fff!important;border-color:rgba(141,180,255,.6)!important}
.hero-story{display:grid;gap:12px}
.meet{color:#C9D8FF;font-size:15px;max-width:52ch}
.meet b{color:#fff}
.hero .wrap>*{min-width:0}
.story{width:100%}
.search h2{font-size:20px}
.search .pinrow{display:flex;gap:10px;margin-top:14px}
.search .pinrow input{flex:1;min-width:0;font-family:var(--mono);font-size:22px;letter-spacing:.18em;padding:12px 14px;border:1.5px solid var(--line-strong);border-radius:12px;background:var(--bg)}
.search .pinrow input:focus{border-color:var(--blue);outline:none}
.ptabs{display:flex;gap:4px;background:var(--blue-soft);border-radius:14px;padding:4px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptab{flex:1 0 auto;border:0;background:transparent;border-radius:10px;padding:9px 12px;font:inherit;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;min-height:40px}
.ptab[aria-selected="true"]{background:var(--surface);color:var(--blue);box-shadow:0 1px 4px rgba(10,40,100,.14)}
.ptab:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--blue)}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}

/* sections */
section.sec{padding-block:56px}
.sec-head{display:grid;gap:8px;margin-bottom:24px}
.sec-head h2{font-size:clamp(26px,3.6vw,36px)}
.sec-head p{color:var(--muted);max-width:62ch}

/* results */
.results{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.results{grid-template-columns:1fr}}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:18px;position:sticky;top:84px}
@media (max-width:900px){.filters{position:static}}
.filters h3{font-size:15px;font-family:var(--body);font-weight:800}
.fgroup{display:grid;gap:8px}
.fgroup label.lbl{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.check{display:flex;gap:9px;align-items:center;font-weight:600;font-size:14.5px;cursor:pointer}
.check input{accent-color:var(--blue);width:17px;height:17px}
input[type=range]{width:100%;accent-color:var(--blue)}
.reshead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.reshead h3{font-size:20px}
select.sel{padding:8px 10px;border-radius:9px;border:1.5px solid var(--line-strong);background:var(--surface);font-weight:600}
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.plan{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;align-content:start;position:relative;transition:border-color .15s,box-shadow .15s}
.plan:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.plan.sel{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.plan .prov{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
.plogo{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;font-size:13px;flex:none}
.plan .pname{font-family:var(--display);font-size:18px;font-weight:700}
.speed{display:flex;align-items:baseline;gap:6px}
.speed b{font-family:var(--display);font-size:38px;font-weight:800;line-height:1;color:var(--blue)}
.speed span{font-weight:700;color:var(--muted)}
.price{font-family:var(--display);font-size:22px;font-weight:800}
.price small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:600}
.facts{display:grid;gap:6px;font-size:14px}
.facts div{display:flex;justify-content:space-between;gap:10px;border-top:1px dashed var(--line);padding-top:6px}
.facts span{color:var(--muted)}
.ott{display:flex;flex-wrap:wrap;gap:6px}
.ott em{font-style:normal;font-size:12px;font-weight:700;background:var(--blue-soft);color:var(--blue);padding:3px 8px;border-radius:6px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:6px}
.badge.demo{background:var(--warn-soft);color:var(--warn)}
.badge.sim{background:var(--warn-soft);color:var(--warn)}
.plan .badge.demo{position:absolute;top:14px;right:14px}
.plan .acts{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:2px}
.empty{background:var(--surface);border:1.5px dashed var(--line-strong);border-radius:var(--r);padding:28px;text-align:center;display:grid;gap:10px;justify-items:center}
.cmpbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:35;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 20px 40px -10px rgba(0,0,0,.4);max-width:calc(100% - 32px)}
.cmpbar b{white-space:nowrap}

.notice{display:block;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:14px;font-weight:600}
.notice.info{background:var(--blue-soft);color:var(--blue)}

/* steps / partner */
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:760px){.steps3{grid-template-columns:1fr}}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:8px}
.step .n{font-family:var(--mono);color:var(--blue);font-weight:600;font-size:13px}
.step h3{font-size:18px}
.step p{color:var(--muted)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card h3{font-size:18px;margin-bottom:6px}
ul.ticks{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
ul.ticks li{padding-left:24px;position:relative}
ul.ticks li::before{content:"";position:absolute;left:2px;top:.55em;width:12px;height:7px;border-left:2.5px solid var(--blue);border-bottom:2.5px solid var(--blue);transform:rotate(-45deg)}

/* forms */
.field{display:grid;gap:6px}
.field label{font-weight:700;font-size:14px}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line-strong);border-radius:10px;background:var(--surface);font-size:15.5px}
.field textarea{min-height:90px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);outline:none}
.field .hint{font-size:12.5px;color:var(--muted)}
.field.bad input,.field.bad select,.field.bad textarea{border-color:var(--bad)}
.ferr{color:var(--bad);font-size:13px;font-weight:600;min-height:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.formerr{color:var(--bad);font-weight:700;font-size:14px}

/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(5,14,40,.55);display:grid;place-items:center;padding:16px;overflow-y:auto}
.mbox{background:var(--surface);color:var(--ink);border-radius:18px;width:100%;min-width:0;max-width:520px;padding:24px;position:relative;box-shadow:0 40px 80px -30px rgba(0,0,0,.6);border-top:4px solid var(--blue)}
.mbox.wide{max-width:860px}
.mbox h2{font-size:22px;padding-right:36px}
.mclose{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:0;background:var(--bg);font-size:20px;line-height:1;cursor:pointer;color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;font-weight:700;font-size:14.5px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast.bad{background:var(--bad);color:#fff}

/* dashboards */
.dash{padding-block:28px 64px}
.dhead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.dhead h1{font-size:clamp(24px,3.4vw,32px)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;scrollbar-width:thin;border-bottom:1px solid var(--line)}
.tabs button{flex:none;background:none;border:0;border-bottom:2.5px solid transparent;padding:10px 12px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--blue);border-bottom-color:var(--blue)}
.tabs .cnt{display:inline-block;min-width:20px;padding:1px 6px;margin-left:6px;border-radius:999px;background:var(--blue-soft);color:var(--blue);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi span{display:block;font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi b{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.kpi small{display:block;color:var(--muted);font-size:13px}
.list{display:grid;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.item .ih{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.item .ih h3{font-size:16px;font-family:var(--body);font-weight:800}
.item .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;color:var(--muted)}
.item .meta b{color:var(--ink);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.p-blue{background:var(--blue-soft);color:var(--blue)} .p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)}
.p-grey{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--bg)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.track{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-top:4px}
.track div{display:grid;gap:5px;font-size:11.5px;font-weight:700;color:var(--muted);text-align:center}
.track div::before{content:"";height:5px;border-radius:5px;background:var(--line)}
.track div.done{color:var(--ink)} .track div.done::before{background:var(--blue)}
.track div.now{color:var(--blue)} .track div.now::before{background:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.timeline{display:grid;gap:10px;border-left:2px solid var(--line);padding-left:14px;margin-left:4px}
.timeline div{position:relative;font-size:14px}
.timeline div::before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--blue)}
.timeline small{color:var(--muted);display:block}
/* contacts + chat */
.contacts{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:20px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:5px;align-content:start;min-width:0}
.ccard .crole{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.ccard .cnm{font-weight:800;font-size:15.5px}
.ccard .cln{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.ccard .cln b{color:var(--ink);font-weight:700}
.cacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.cbtn{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:8px;padding:5px 9px;font-size:12.5px;font-weight:700;text-decoration:none;cursor:pointer;white-space:nowrap;line-height:1.2}
.cbtn:hover{border-color:var(--blue)}
.cbtn.wa{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cbtn.chatb{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.cbtn svg{width:14px;height:14px;flex:none}
.chat{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px}
@media (max-width:760px){.chat{grid-template-columns:1fr}}
.threads{display:grid;gap:6px;align-content:start;max-height:70vh;overflow-y:auto}
.thread{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:grid;gap:2px;color:var(--ink);min-width:0}
.thread[aria-current="true"]{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.thread b{font-size:14.5px;display:flex;gap:6px;align-items:center}
.thread small{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.unread{background:var(--blue);color:var(--blue-ink);font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px;margin-left:auto}
.convo{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:min(560px,70vh);min-width:0}
.convo .chd{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.convo .chd h3{font-size:16px;font-family:var(--body);font-weight:800}
.msgs{overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.msg{max-width:80%;padding:8px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14.5px;align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.mine{align-self:flex-end;background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.msg .mwho{display:block;font-size:11.5px;font-weight:800;opacity:.85;margin-bottom:2px;white-space:normal}
.msg time{display:block;font-size:11px;opacity:.75;margin-top:3px;text-align:right}
.sendbar{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.sendbar input{flex:1;min-width:0;padding:10px 12px;border:1.5px solid var(--line-strong);border-radius:10px;background:var(--surface);font-size:15px}
.sendbar input:focus{border-color:var(--blue);outline:none}
.paycard{display:grid;gap:12px}
.methods{display:flex;flex-wrap:wrap;gap:6px}
.cchart{display:grid;gap:10px}
.ccols{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;height:190px;align-items:end;padding-top:18px;border-bottom:1px solid var(--line)}
.ccol{display:grid;grid-template-rows:minmax(0,1fr);height:100%}
.cbars{display:flex;gap:3px;align-items:flex-end;height:100%}
.cbars i{flex:1;border-radius:5px 5px 0 0;position:relative;min-height:2px}
.cbars i span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;color:var(--ink);font-style:normal;white-space:nowrap;padding-bottom:2px}
.clabels{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.clegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;font-weight:700;color:var(--muted)}
.clegend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.prog{height:14px;border-radius:8px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--blue);border-radius:8px}
.prog.ok i{background:var(--ok)}
.promise{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:center;border-left:4px solid var(--blue);margin-bottom:18px}
@media (max-width:760px){.promise{grid-template-columns:1fr}}
.promise .big{font-family:var(--display);font-size:40px;font-weight:800;line-height:1}
.zgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.zcard{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--zc,var(--line-strong));border-radius:12px;padding:14px;display:grid;gap:6px;align-content:start}
.zcard.none{--zc:var(--bad)} .zcard.low{--zc:var(--warn)} .zcard.good{--zc:var(--ok)}

.zcard .zhint{font-size:13px;background:var(--bg);border-radius:8px;padding:8px 10px}
.zcard[aria-current="true"]{box-shadow:0 0 0 3px var(--blue-soft);border-color:var(--blue)}
.methods span{font-size:12.5px;font-weight:700;padding:4px 9px;border-radius:7px;background:var(--bg);border:1px solid var(--line)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:14px;font-weight:600}
.bar .t{height:12px;border-radius:6px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.bar .t i{display:block;height:100%;background:var(--blue);border-radius:6px}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
/* speed test */
.st{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:28px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px}
@media (max-width:820px){.st{grid-template-columns:1fr;padding:20px}}
.dial{display:grid;place-items:center;gap:4px;text-align:center}
.dial svg{width:min(270px,100%);height:auto}
.dial .big{font-family:var(--display);font-weight:800;font-size:60px;line-height:1;font-variant-numeric:tabular-nums}
.dial .unit{color:var(--muted);font-weight:700}
.dial .phase{font-weight:700;color:var(--blue);min-height:1.4em;font-size:14.5px}
.st-res{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.st-res div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.st-res span{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.st-res b{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.st-res small{color:var(--muted);font-weight:700;margin-left:4px}
.st-verdict{font-weight:700;min-height:1.4em}
.badge.live{background:var(--blue-soft);color:var(--blue)}
.mstats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mstats div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.mstats span{display:block;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mstats b{font-size:15px;overflow-wrap:anywhere}
.dev-dev{font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.dev-dev code{font-family:var(--mono);font-size:12px;overflow-wrap:anywhere}
.tr-hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:center;border-left:4px solid var(--blue)}
@media (max-width:820px){.tr-hero{grid-template-columns:1fr}}
ol.trsteps{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:t}
ol.trsteps li{counter-increment:t;display:grid;gap:2px;padding-left:40px;position:relative}
ol.trsteps li::before{content:counter(t);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--blue-soft);color:var(--blue);font-weight:800;display:grid;place-items:center;font-size:14px}
ol.trsteps span{color:var(--muted);font-size:14px}
.locked{max-width:560px;margin:40px auto;text-align:center;display:grid;gap:12px;justify-items:center}
.accts{display:grid;gap:10px}
.acct{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line-strong);background:var(--surface);cursor:pointer;color:var(--ink)}
.acct:hover{border-color:var(--blue)}
.acct b{display:block}
.acct small{color:var(--muted)}
footer{border-top:1px solid var(--line);padding-block:32px;color:var(--muted);font-size:14px;background:var(--surface)}
.fgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:24px}
@media (max-width:760px){.fgrid{grid-template-columns:1fr}}
footer h4{font-family:var(--body);font-size:14px;color:var(--ink);margin-bottom:8px}
footer ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
footer button.linkbtn{color:var(--muted);text-decoration:none;font-weight:600}
/* ===== Bhai story: one 15 s loop, 5 scenes of 3 s (seekable for video export) ===== */
.story{position:relative;border-radius:22px;overflow:hidden;background:#EEF4FF;box-shadow:0 30px 60px -30px rgba(0,0,0,.55);max-width:100%}
.story .stage{display:block;width:100%;height:auto}
.story *{animation-duration:15s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.story .sc{opacity:0}
.story .sc1{animation-name:s1}.story .sc2{animation-name:s2}.story .sc3{animation-name:s3}.story .sc45{animation-name:s45}.story .sc5{animation-name:s5}
@keyframes s1{0%,17%{opacity:1}20%,97%{opacity:0}100%{opacity:1}}
@keyframes s2{0%,18%{opacity:0}22%,37%{opacity:1}40%,100%{opacity:0}}
@keyframes s3{0%,38%{opacity:0}42%,57%{opacity:1}60%,100%{opacity:0}}
@keyframes s45{0%,58%{opacity:0}62%,97%{opacity:1}100%{opacity:0}}
@keyframes s5{0%,78%{opacity:0}82%,97%{opacity:1}100%{opacity:0}}
/* expressions */
.story .brows-sad,.story .m-sad{animation-name:sad}
.story .m-happy{animation-name:happy}
.story .eyes-normal{animation-name:normaleyes}
.story .eyes-star{animation-name:stareyes}
@keyframes sad{0%,18%{opacity:1}21%,98%{opacity:0}100%{opacity:1}}
@keyframes happy{0%,18%{opacity:0}21%,98%{opacity:1}100%{opacity:0}}
@keyframes normaleyes{0%,79%{opacity:1}81%,98%{opacity:0}100%{opacity:1}}
@keyframes stareyes{0%,79%{opacity:0}81%,98%{opacity:1}100%{opacity:0}}
.story .blink{animation:blink 3s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.story .hop{animation:hop 1.5s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.story .arm{animation-name:arm}
@keyframes arm{0%,17%{transform:rotate(95deg)}22%,37%{transform:rotate(0deg)}42%,57%{transform:rotate(48deg)}62%,97%{transform:rotate(80deg)}100%{transform:rotate(95deg)}}
.story .wave{animation:wave .7s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.story .plug{animation-name:plug}
@keyframes plug{0%,58%{opacity:0}62%,97%{opacity:1}100%{opacity:0}}
.story .spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.story .sweat{animation:sweat 1.2s ease-in infinite}
@keyframes sweat{0%{transform:translateY(0);opacity:1}100%{transform:translateY(22px);opacity:0}}
.story .typer{transform-origin:286px 0;animation-name:typer}
@keyframes typer{0%,22%{transform:scaleX(0)}31%,100%{transform:scaleX(1)}}
.story .pop2{animation-name:pop2}
@keyframes pop2{0%,31%{opacity:0;transform:translateY(10px)}34%,100%{opacity:1;transform:none}}
.story .card{animation-name:card}
.story .c2{animation-name:card2}.story .c3{animation-name:card3}
@keyframes card{0%,40%{opacity:0;transform:translateY(30px)}44%,100%{opacity:1;transform:none}}
@keyframes card2{0%,42%{opacity:0;transform:translateY(30px)}46%,100%{opacity:1;transform:none}}
@keyframes card3{0%,44%{opacity:0;transform:translateY(30px)}48%,100%{opacity:1;transform:none}}
.story .tick{transform-origin:384px 100px;animation-name:tick}
@keyframes tick{0%,49%{transform:scale(0)}52%{transform:scale(1.25)}54%,100%{transform:scale(1)}}
.story .fiber{stroke-dasharray:100;animation-name:fiber}
@keyframes fiber{0%,62%{stroke-dashoffset:100}70%,100%{stroke-dashoffset:0}}
.story .led{animation-name:led}
@keyframes led{0%,70%{fill:#E5484D}72%,100%{fill:#22C55E}}
.story .w1,.story .w2,.story .w3{opacity:0}
.story .w1{animation-name:w1}.story .w2{animation-name:w2}.story .w3{animation-name:w3}
@keyframes w1{0%,72%{opacity:0}74%,100%{opacity:1}}
@keyframes w2{0%,74%{opacity:0}76%,100%{opacity:1}}
@keyframes w3{0%,76%{opacity:0}78%,100%{opacity:1}}
.story .confetti{animation-name:confetti}
@keyframes confetti{0%,80%{transform:translateY(-20px);opacity:0}84%{opacity:1}97%{transform:translateY(40px);opacity:1}100%{opacity:0}}
/* captions */
.story .caps{position:absolute;left:0;right:0;top:0;padding:14px 18px;display:grid;pointer-events:none}
.story .cap{grid-area:1/1;margin:0;justify-self:start;background:#0A1B3D;color:#fff;font-family:Sora,Manrope,system-ui,sans-serif;font-weight:700;font-size:clamp(13px,2.2vw,17px);padding:8px 14px;border-radius:12px;opacity:0;max-width:92%}
.story .cap b{color:#8DB4FF}
.story .cp1{animation-name:s1}.story .cp2{animation-name:s2}.story .cp3{animation-name:s3}.story .cp4{animation-name:c4}.story .cp5{animation-name:s5}
@keyframes c4{0%,58%{opacity:0}62%,77%{opacity:1}80%,100%{opacity:0}}
.story-ctl{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.sbtn{width:34px;height:34px;border-radius:50%;border:0;background:rgba(10,27,61,.75);color:#fff;font-size:13px;cursor:pointer;display:grid;place-items:center}
.sbtn:focus-visible{outline:3px solid #8DB4FF}
.story.paused *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){.story *{animation-play-state:paused!important;animation-delay:-13.2s!important}}
/* logo mark: blink + wink on hover */
.bhai-mark .lm-eyes{transform-origin:32px 37px;animation:blink 4s infinite}
.brand:hover .bhai-mark .lm-eyeR{transform-origin:37.5px 37px;transform:scaleY(.15)}


/* navbar: floating white pill on the hero blue (from Figma) */
.top{background:var(--blue-deep);border-bottom:0;backdrop-filter:none;padding:14px 0 6px}
.top>.wrap{width:min(1200px,calc(100% - 32px));max-width:none;background:var(--surface);border-radius:99px;min-height:68px;padding:0 14px 0 24px;gap:14px;box-shadow:0 8px 28px rgba(5,15,60,.28)}
.topnav{gap:2px;margin-left:18px}
.topnav button{border-radius:99px;font-size:14.5px;color:var(--muted)}
.langchip{font-size:12px;font-weight:800;letter-spacing:.02em;background:var(--blue-soft);color:var(--blue);border-radius:99px;padding:9px 14px}
.top .acts .btn{border-radius:99px;padding:10px 20px;font-size:14.5px}
.top .acts .btn-ghost{border:1.5px solid var(--blue);color:var(--blue);background:transparent}
@media (max-width:600px){.top>.wrap{padding:0 10px 0 16px;min-height:60px}.langchip{display:none}.top .acts .btn{padding:9px 14px}}

/* navbar = exact Figma header */
.top,.top *{font-family:'Poppins',var(--body,system-ui),sans-serif}
.top>.wrap{height:76px;min-height:76px;gap:20px;padding:0 28px 0 30px}
.brand{gap:10px;font-size:19px;font-weight:700;color:#10226B}
.brand .bt{display:flex;flex-direction:column;line-height:1;text-align:left}
.brand .bn b{color:#2447D9}
.brand small{font-size:11.5px;font-weight:500;color:#10226B;margin-top:3px;letter-spacing:0}
.topnav{gap:26px;margin-left:10px}
.topnav button{padding:0;border-radius:0;background:none!important;font-size:15px;font-weight:500;color:#4A5A8C;white-space:nowrap}
.topnav button:hover,.topnav button[aria-current="page"]{color:#2447D9}
.topnav .car{font-size:12px;margin-left:4px}
.top .acts{gap:10px}
.top .acts .btn{height:42px;padding:0 22px;font-size:15px;font-weight:600;border-radius:99px;white-space:nowrap}
.top .acts .btn-ghost{border:1.5px solid #2447D9;color:#2447D9}
.top .acts .btn-primary{background:#2447D9;color:#fff;border:0}
.langchip{font-size:12px;font-weight:700;background:#EEF3FF;color:#2447D9;padding:9px 14px;border-radius:99px}
.burger{display:none;width:42px;height:42px;border:0;background:none;cursor:pointer;flex-direction:column;justify-content:center;gap:5px;align-items:center}
.burger i{display:block;width:22px;height:2.5px;border-radius:2px;background:#10226B}
.mnav{display:flex;flex-direction:column;width:min(1200px,calc(100% - 32px));margin:8px auto 0;background:var(--surface);border-radius:24px;padding:10px;box-shadow:0 8px 28px rgba(5,15,60,.28)}
.mnav[hidden]{display:none}
.mnav button{background:none;border:0;text-align:left;padding:14px 16px;font-size:15px;font-weight:500;color:#4A5A8C;border-radius:14px;cursor:pointer}
.mnav button:hover{background:#EEF3FF;color:#2447D9}
.mnav .car{font-size:12px;margin-left:4px}
@media (min-width:901px){.mnav{display:none!important}}
@media (max-width:900px){.topnav{display:none}.burger{display:flex}.top .acts .lg,.top .acts .fp{display:none}.top>.wrap{height:64px;min-height:64px;padding:0 10px 0 16px}.langchip{display:inline-block}.brand{font-size:17px}}
@media (max-width:1100px) and (min-width:901px){.topnav{gap:16px}.top>.wrap{gap:12px;padding:0 18px}.langchip{display:none}}

.lang{position:relative}
.langchip{border:0;cursor:pointer;display:inline-flex;align-items:center;gap:4px;height:42px;padding:0 14px}
.langchip .car{font-size:12px}
.langmenu{position:absolute;right:0;top:calc(100% + 10px);min-width:170px;background:var(--surface);border-radius:16px;padding:6px;box-shadow:0 12px 32px rgba(5,15,60,.28);z-index:60}
.langmenu[hidden]{display:none}
.langmenu button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:11px 12px;border-radius:10px;font-size:14.5px;font-weight:500;color:#4A5A8C;cursor:pointer;text-align:left}
.langmenu button b{display:inline-grid;place-items:center;min-width:30px;height:24px;border-radius:99px;background:#EEF3FF;color:#2447D9;font-size:11.5px;font-weight:700}
.langmenu button i{margin-left:auto;font-style:normal;color:#2447D9;visibility:hidden}
.langmenu button[aria-selected="true"]{color:#10226B;font-weight:600}
.langmenu button[aria-selected="true"] i{visibility:visible}
.langmenu button:hover{background:#EEF3FF}

/* plan cards: selected design (brand | details | price) */
.results .plans{grid-template-columns:1fr;gap:16px}
.plan.pc{display:grid;grid-template-columns:200px minmax(0,1fr) 210px;gap:0;padding:0;overflow:hidden;border-radius:18px;align-content:stretch}
.pc-brand{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:20px;background:var(--blue-soft);background:color-mix(in srgb,var(--blue-soft) 45%,var(--surface));border-right:1px solid var(--line)}
.pc-brand .plogo{width:46px;height:46px;border-radius:14px;font-size:15px}
.pc-brand .pbi b{display:block;font-size:15px;font-weight:800}
.pc-brand .pbi small{display:block;color:var(--muted);font-size:12.5px;font-weight:600;margin-top:2px}
.plan .pc-brand .badge.demo{position:static;margin-top:auto}
.pc-main{padding:20px 22px;display:grid;gap:14px;align-content:start;min-width:0}
.pc-main .pname{font-size:19px}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px}
.specs>div{background:var(--blue-soft);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.specs span{font-size:11.5px;color:var(--muted);font-weight:600}
.specs b{font-size:14px;white-space:nowrap}
.pc-buy{padding:20px;border-left:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:center;align-items:stretch}
.pc-buy .price{font-size:30px}
.pc-buy .check{justify-content:center}
.pc-buy .btn{padding:12px 16px;border-radius:12px}
@media (max-width:900px){
 .plan.pc{grid-template-columns:104px minmax(0,1fr)}
 .pc-brand{grid-column:1;grid-row:1;padding:14px 10px;gap:6px}
 .pc-brand .plogo{width:42px;height:42px;font-size:13px}
 .pc-brand .pbi b{font-size:13px}.pc-brand .pbi small{font-size:11px}
 .pc-main{grid-column:2;grid-row:1;padding:14px}
 .pc-main .pname{font-size:16px}
 .specs{grid-template-columns:1fr 1fr;gap:6px}.specs>div{padding:7px 9px}
 .pc-buy{grid-column:1/3;grid-row:2;border-left:0;border-top:1px solid var(--line);flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;text-align:left;padding:12px 14px}
 .pc-buy .price{font-size:24px}
 .pc-buy .check{flex-basis:100%;justify-content:flex-start;order:3}
}

/* search card animation */
.search{animation:cardIn .7s cubic-bezier(.2,.8,.2,1) .15s both}
@keyframes cardIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.ptabs{position:relative}
.ptab{position:relative;z-index:1;transition:color .25s}
.ptab:hover{color:var(--blue)}
.ptabs.has-ind .ptab[aria-selected="true"]{background:transparent;box-shadow:none}
.ptab-ind{position:absolute;left:0;top:4px;bottom:4px;border-radius:10px;background:var(--surface);box-shadow:0 2px 8px rgba(10,40,100,.18);transition:transform .4s cubic-bezier(.3,1.2,.4,1),width .4s cubic-bezier(.3,1.2,.4,1);z-index:0}
#searchBody.swap>h2,#searchBody.swap>p,#searchBody.swap>.pinrow,#searchBody.swap>.linkbtn,#searchBody.swap>.btn,#searchBody.swap>.chips{animation:bodyIn .45s cubic-bezier(.2,.8,.2,1) both}
#searchBody.swap>p{animation-delay:.05s}
#searchBody.swap>.pinrow{animation-delay:.1s}
#searchBody.swap>.linkbtn{animation-delay:.16s}
#searchBody.swap>.btn{animation-delay:.12s}
#searchBody.swap>.chips{animation-delay:.2s}
#searchBody.swap .chip{animation:chipIn .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.22s + var(--i,0)*45ms)}
@keyframes bodyIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes chipIn{from{opacity:0;transform:translateY(8px) scale(.92)}to{opacity:1;transform:none}}
.search .chip{transition:background .2s,color .2s,border-color .2s,transform .2s,box-shadow .2s}
.search .chip:hover{transform:translateY(-2px);box-shadow:0 6px 14px -6px rgba(20,80,230,.45);border-color:var(--blue)}
.search .chip:active{transform:scale(.96)}
.search .chip[aria-pressed="true"]{animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.search .pinrow input{transition:border-color .2s,box-shadow .25s,background .2s}
.search .pinrow input:focus{box-shadow:0 0 0 4px rgba(20,80,230,.18);background:var(--surface)}
.search .btn-primary{transition:transform .2s,box-shadow .2s,background .2s}
.search .btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 20px -8px rgba(20,80,230,.7)}
.search .btn-primary:active{transform:scale(.97)}
.search .linkbtn{transition:letter-spacing .2s}
.search .linkbtn:hover{letter-spacing:.01em}
@media (prefers-reduced-motion:reduce){.search,.search *,.ptab-ind{animation:none!important;transition:none!important}}

/* scroll targets stay clear of the sticky navbar */
html{scroll-padding-top:64px}
#results,#how,#router,#partners,#search,main section[id]{scroll-margin-top:64px}
.step{align-content:start}

/* chevrons + hero trust list + hero links */
.car{display:inline-block;vertical-align:middle;margin-left:6px;transition:transform .25s;flex:none}
.langchip .car{margin-left:2px}
.langchip[aria-expanded="true"] .car{transform:rotate(180deg)}
.hero .trust{display:grid;gap:10px;margin-top:20px}
.hero .trust span{display:flex;align-items:center;gap:10px;font-size:15px}

.hero-links{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
.hero-link{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 20px;border-radius:99px;border:1.5px solid rgba(141,180,255,.55);background:rgba(255,255,255,.06);color:#fff;font:inherit;font-size:14.5px;font-weight:700;cursor:pointer;transition:background .2s,border-color .2s,transform .2s}

/* callback card */
.cbcard{display:flex;align-items:center;gap:16px;margin-top:20px;padding:18px 20px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;box-shadow:0 8px 24px -14px rgba(10,40,100,.25)}
.cbicon{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue)}
.cbtext{display:grid;gap:2px;min-width:0;flex:1}
.cbtext b{font-family:var(--display);font-size:17px;font-weight:700}

.cbbtn{flex:none;display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 22px;border-radius:99px;font-size:14.5px;font-weight:700;transition:transform .2s,box-shadow .2s}
.cbbtn .arr{transition:transform .25s}
.cbbtn:hover{transform:translateY(-2px);box-shadow:0 10px 20px -8px rgba(20,80,230,.7)}
.cbbtn:hover .arr{transform:translateX(4px)}
@media (max-width:700px){.cbcard{flex-wrap:wrap}.cbtext{flex-basis:calc(100% - 70px)}.cbbtn{width:100%;justify-content:space-between}}

/* hero extras: trust strip + two equal links */
.hero .trust{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:22px}
.hero .trust span{flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(141,180,255,.22);font-size:13.5px;line-height:1.35;color:#DCE7FF}
.hero-links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.hero-link{justify-content:space-between;padding:0 18px;font-size:14px;white-space:nowrap}
@media (max-width:1100px){.hero-link{font-size:13px;padding:0 14px}}

/* ---------- router ---------- */
function go(view, tab, opts) {
  S.view = view; S.tab = tab || null;
  try { history.replaceState(null, "", "#" + view + (tab ? "-" + tab : "")); } catch (e) {}
  renderHeader(); render(); updateCompareBar();
  if (opts && opts.scroll) setTimeout(() => { const el = document.getElementById(opts.scroll); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }, 30);
  else window.scrollTo(0, 0);
}
async function render() {
  const v = S.view;
  if (v === "home") return renderHome();
  if (v === "speed") return renderSpeed();
  if (v === "router") return renderRouter().catch(e => { app.innerHTML = `<div class="wrap dash"><div class="empty"><b>Could not load router status.</b><p class="muted">${esc(errMsg(e))}</p></div></div>`; });
  const need = { my: "customer", dsa: "dsa", tip: "tip", admin: "admin" }[v];
  const u = me();
  if (!u || u.role !== need) {
    app.innerHTML = `<div class="wrap"><div class="locked"><span class="eyebrow">${ROLE_NAME[need]} access</span><h1 style="font-size:28px">Log in as ${ROLE_NAME[need].toLowerCase()} to open this page</h1>

      <button class="btn btn-primary" data-act="login" type="button">Log in</button></div></div>`;
    return;
  }
  app.innerHTML = `<div class="wrap dash"><p class="muted">Loading…</p></div>`;
  try { await ({ my: renderCustomer, dsa: renderDSA, tip: renderTIP, admin: renderAdmin }[v])(); scrollChat(); }
  catch (e) { app.innerHTML = `<div class="wrap dash"><div class="empty"><b>Could not load this page.</b><p class="muted">${esc(errMsg(e))}</p><button class="btn btn-primary" data-act="reload" type="button">Try again</button></div></div>`; }
}

const monthKeys = n => { const d = new Date(), a = []; for (let i = n - 1; i >= 0; i--) { const x = new Date(d.getFullYear(), d.getMonth() - i, 1); a.push(x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0")); } return a; };

function pStats(p, leads, bookings, comms, charges, st) {
  const isT = p.type === "tip", keys = monthKeys(6), cur = keys[5];
  const mine = leads.filter(l => (isT ? l.assigned_tip_id : l.assigned_dsa_id) === p.id);
  const given = isT ? mine : mine.filter(l => l.source !== "dsa"), own = isT ? [] : mine.filter(l => l.source === "dsa");
  const inst = bookings.filter(b => b.status === "installed" && (isT ? b.tip_partner_id : b.dsa_partner_id) === p.id);
  const cm = comms.filter(c => c.partner_id === p.id && c.status !== "rejected"), fees = charges.filter(c => c.partner_id === p.id && c.kind === "platform_fee");
  const price = b => b.plan ? b.plan.price_monthly : 0, share = Number(st.tip_share_percent) || 0;
  const billing = sumBy(inst, price), closed = mine.filter(l => ["installed", "lost"].includes(l.status)).length, won = mine.filter(l => l.status === "installed").length;
  const end = k => { const [y, m] = k.split("-").map(Number); return new Date(y, m, 1).toISOString(); };
  const by = keys.map(k => ({ k, leads: given.filter(l => mKey(l.assigned_at || l.created_at) === k).length, installs: inst.filter(b => mKey(b.installed_at) === k).length,
    comm: sumBy(cm.filter(c => mKey(c.created_at) === k), c => c.amount), billing: sumBy(inst.filter(b => (b.installed_at || "") < end(k)), price) }));
  const target = Number(p.lead_target) || Number(st.lead_target_default) || 20;
  const dNow = new Date(), daysLeft = new Date(dNow.getFullYear(), dNow.getMonth() + 1, 0).getDate() - dNow.getDate();
  return { p, isT, keys, by, given, own, inst, won, target, daysLeft, share, billing, thisMonth: by[5].leads, installsMonth: by[5].installs,
    conv: closed ? Math.round(won / closed * 100) : 0, open: mine.filter(l => !["installed", "lost"].includes(l.status)).length,

    fee: { paid: sumBy(fees.filter(c => c.status === "paid"), c => c.amount), due: sumBy(fees.filter(c => ["due", "failed"].includes(c.status)), c => c.amount) } };

function getCoords() {
  return new Promise((res, rej) => {
    const sim = () => LIVE ? rej(new AppError("Allow location access in your browser, or type your PIN code.")) : res({ lat: 22.7533 + Math.random() * 0.004, lng: 75.8937 + Math.random() * 0.004, simulated: true });
    if (!navigator.geolocation) return sim();
    let done = false; const t = setTimeout(() => { if (!done) { done = true; sim(); } }, 6000);
    navigator.geolocation.getCurrentPosition(p => { if (done) return; done = true; clearTimeout(t); res({ lat: p.coords.latitude, lng: p.coords.longitude }); }, () => { if (done) return; done = true; clearTimeout(t); sim(); }, { enableHighAccuracy: true, timeout: 5500, maximumAge: 60000 });
  });
}

let stLast = null;
async function renderSpeed() {

        <svg viewBox="0 0 220 130" aria-hidden="true"><path d="M20 115 A90 90 0 0 1 200 115" fill="none" stroke="var(--line)" stroke-width="16" stroke-linecap="round"/><path id="stArc" d="M20 115 A90 90 0 0 1 200 115" fill="none" stroke="var(--blue)" stroke-width="16" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100"/><text x="20" y="128" font-size="10" fill="var(--muted)" text-anchor="middle">0</text><text x="110" y="16" font-size="10" fill="var(--muted)" text-anchor="middle">100</text><text x="200" y="128" font-size="10" fill="var(--muted)" text-anchor="middle">300+</text></svg>

        <p class="st-verdict" id="stVerdict"></p>
        ${conns.length ? field("st-conn", "Save result to", `<select id="st-conn">${conns.map(b => `<option value="${b.id}">${esc(b.plan ? b.plan.provider.name + " · " + b.plan.name + " (" + b.plan.speed_mbps + " Mbps)" : b.ref_code)}</option>`).join("")}</select>`) : ""}
        <div class="row"><button class="btn btn-primary" id="stGo" data-act="st-go" type="button">Start speed test</button><button class="btn btn-ghost" id="stReport" data-act="st-report" type="button" hidden>Report slow speed</button></div>
        <p class="muted small">${u ? (conns.length ? "Results are saved to your connection so support can see them." : u.role === "customer" ? "Results are saved to your account." : "") : `<button class="linkbtn" data-act="login" type="button">Log in</button> to save results and report slow speed to support.`} The test uses Cloudflare's speed test servers.</p>
      </div>
    </div>
    <div class="steps3" style="margin-top:18px">
      <div class="step"><span class="n">Tip 1</span><h3>Stay close to the router</h3><p>Walls and floors reduce Wi-Fi speed. Test in the same room first.</p></div>
      <div class="step"><span class="n">Tip 2</span><h3>Pause other downloads</h3><p>Streaming, updates and other devices share the same connection.</p></div>
      <div class="step"><span class="n">Tip 3</span><h3>Compare with the router test</h3><p>If the router test is fast but Wi-Fi is slow, the Wi-Fi setup needs attention, not the line.</p></div>

function stDial(m) { const a = document.getElementById("stArc"); if (!a) return; const pct = Math.min(100, m <= 100 ? m / 2 : 50 + (Math.min(m, 300) - 100) / 4); a.setAttribute("stroke-dasharray", pct.toFixed(1) + " 100"); document.getElementById("stBig").textContent = Math.round(m); }
const stF = (v, d) => (v == null || isNaN(v)) ? "–" : Number(v).toFixed(d == null ? 1 : d);
function stVerdict(d) { if (d >= 100) return "Excellent. 4K streaming, gaming and work from home will run smoothly."; if (d >= 40) return "Good. HD streaming and video calls will work well."; if (d >= 10) return "Slow. Basic browsing works; streaming may buffer."; return "Very slow. Report it so a technician can check the connection."; }
async function stFinish(r) {
  stLast = r; const $i = id => document.getElementById(id);
  if (!$i("stGo")) return;
  $i("stDown").textContent = stF(r.down); $i("stUp").textContent = stF(r.up); $i("stPing").textContent = stF(r.ping, 0); $i("stJit").textContent = stF(r.jit, 0);
  stDial(r.down || 0); $i("stPhase").textContent = r.simulated ? "Simulated result (the preview cannot reach speed test servers)" : "Test complete";
  $i("stVerdict").textContent = stVerdict(r.down || 0); $i("stReport").hidden = false;
  $i("stGo").disabled = false; $i("stGo").textContent = "Test again";
  const u = me();
  if (u) { const c = $i("st-conn"); try { await API.recordSpeedTest(c ? c.value : null, r); toast("Result saved" + (c ? " to your connection." : ".")); } catch (e) { toast(errMsg(e), true); } }
}
function stRun() {
  const $i = id => document.getElementById(id), go = $i("stGo");
  go.disabled = true; go.textContent = "Testing…"; $i("stReport").hidden = true; $i("stVerdict").textContent = ""; ["stDown", "stUp", "stPing", "stJit"].forEach(i => ($i(i).textContent = "–")); stDial(0);
  if (ST_PREVIEW) {
    let t = 0; const target = 70 + Math.random() * 40; $i("stPhase").textContent = "Checking download… (simulated)";
    const iv = setInterval(() => { if (!$i("stGo")) return clearInterval(iv); t++; stDial(target * (0.6 + 0.4 * Math.min(1, t / 12)) * (0.95 + Math.random() * 0.1)); if (t === 14) $i("stPhase").textContent = "Checking upload… (simulated)";
      if (t >= 24) { clearInterval(iv); stFinish({ down: target, up: target * 0.9, ping: 6 + Math.random() * 4, jit: 1 + Math.random() * 2, simulated: true }); } }, 160);
    return;
  }
  $i("stPhase").textContent = "Connecting to the test server…";
  const failed = msg => { $i("stPhase").textContent = msg; go.disabled = false; go.textContent = "Try again"; };
  import("https://cdn.jsdelivr.net/npm/@cloudflare/speedtest@1.3.0/+esm").then(m => {
    const SpeedTest = m.default || m.SpeedTest;
    const st = new SpeedTest({ autoStart: false, measurements: [{ type: "latency", numPackets: 1 }, { type: "download", bytes: 1e5, count: 1, bypassMinDuration: true }, { type: "latency", numPackets: 20 }, { type: "download", bytes: 1e5, count: 8 }, { type: "download", bytes: 1e6, count: 8 }, { type: "upload", bytes: 1e5, count: 8 }, { type: "upload", bytes: 1e6, count: 6 }, { type: "download", bytes: 1e7, count: 6 }, { type: "upload", bytes: 1e7, count: 4 }, { type: "download", bytes: 2.5e7, count: 4 }] });
    st.onResultsChange = ({ type }) => { if (!$i("stGo")) return; const r = st.results;
      if (type === "download") { $i("stPhase").textContent = "Checking download…"; const d = r.getDownloadBandwidth(); if (d) { stDial(d / 1e6); $i("stDown").textContent = stF(d / 1e6); } }
      else if (type === "upload") { $i("stPhase").textContent = "Checking upload…"; const u = r.getUploadBandwidth(); if (u) { stDial(u / 1e6); $i("stUp").textContent = stF(u / 1e6); } }
      else if (type === "latency") { $i("stPhase").textContent = "Checking ping…"; const l = r.getUnloadedLatency(); if (l) $i("stPing").textContent = stF(l, 0); } };
    st.onFinish = r => { const x = r.getSummary(); stFinish({ down: x.download / 1e6, up: x.upload / 1e6, ping: x.latency, jit: x.jitter, simulated: false }); };
    st.onError = () => failed("The test stopped. Check your internet and try again.");
    st.play();
  }).catch(() => failed("Could not load the speed test. Check your internet and try again."));
}

document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if (g) { e.preventDefault(); closeModal(); go(g.dataset.go, null, { scroll: g.dataset.scroll }); return; }
  const t = e.target.closest("[data-tab]");
  if (t && !t.closest("form")) { S.tab = t.dataset.tab; try { history.replaceState(null, "", "#" + S.view + "-" + S.tab); } catch (x) {} render(); return; }
  const a = e.target.closest("[data-act]");
  if (a && actions[a.dataset.act]) { if (a.tagName !== "INPUT") e.preventDefault(); Promise.resolve(actions[a.dataset.act](a, e)).catch(() => {}); }
});
document.addEventListener("input", e => {
  const el = e.target; if (!el.dataset || !el.dataset.filter) return;
  const k = el.dataset.filter;
  if (k === "price") { S.f.price = Number(el.value); $("#f-price-v").textContent = inr(el.value); clearTimeout(S.pt); S.pt = setTimeout(renderResults, 120); return; }
  if (k === "q") { S.f.q = el.value; clearTimeout(S.qt); S.qt = setTimeout(() => { renderResults(); const q = $("#f-q"); if (q) { q.focus(); const n = q.value.length; try { q.setSelectionRange(n, n); } catch (e) {} } }, 160); return; }
});
document.addEventListener("change", e => {
  if (e.target.id === "ac-mode") { const el = document.querySelector('[data-acs="partner"]'); if (el) el.hidden = e.target.value !== "partner"; return; }
  if (e.target.id === "imp-file") { previewImport(e.target); return; }
  if (e.target.name === "category" && e.target.closest("form[data-form=plan], form[data-form=tip-plan]")) { syncPlanForm(e.target.closest("form")); return; }
  if (e.target.name === "sim_conn") { const port = e.target.value === "port"; document.getElementById("sm-port").hidden = !port; document.getElementById("sm-prefwrap").hidden = port; return; }
  if (e.target.dataset && e.target.dataset.zoneLoc) { const v = e.target.value; guard(null, () => API.saveLocationZone(e.target.dataset.zoneLoc, v)).then(() => { toast(v ? "Zone set to " + ZONE_NAME[v] + "." : "Zone removed."); }).catch(() => {}); return; }
  if (e.target.id === "zone-pick") { S.zoneFilter = e.target.value; render(); return; }
  if (e.target.id === "lc-pin") { const z = ZONE_BY_PIN[e.target.value.trim()], sel = document.getElementById("lc-zone"); if (z && sel && !sel.value) sel.value = z; }
  if (e.target.id === "cu-role") { const a = e.target.value === "admin"; ["cu-firm", "cu-pins"].forEach(k => { document.querySelector(`[data-f="${k}"]`).hidden = a; }); document.getElementById("cu-note").hidden = a; return; }
  if (e.target.id === "cp-what") { const a = e.target.value.split("|")[2], inp = document.getElementById("cp-amt"); if (inp) { inp.value = a || ""; if (!a) inp.focus(); } return; }
  if (e.target.id === "dl-pin" && isPin(e.target.value.trim())) { API.searchPlans(e.target.value.trim()).then(r => { const sel = document.getElementById("dl-plan"); if (!sel) return; sel.innerHTML = `<option value="">${r.plans.length ? "No plan yet / callback" : "No plans at this PIN code"}</option>` + r.plans.sort((a, b) => a.price_monthly - b.price_monthly).map(p => `<option value="${p.id}">${esc(p.provider.name)} · ${esc(p.name)} · ${p.speed_mbps} Mbps · ${inr(p.price_monthly)}</option>`).join(""); const ar = document.getElementById("dl-area"); if (ar && !ar.value && r.areas[0]) ar.value = r.areas[0]; }).catch(() => {}); return; }
  if (e.target.id === "nc-payer") { const c = e.target.value === "customer"; document.querySelector('[data-f="nc-partner"]').hidden = c; document.querySelector('[data-f="nc-customer"]').hidden = !c; document.getElementById("nc-kind").value = c ? "customer_payment" : "registration_fee"; return; }
  const el = e.target; if (!el.dataset || !el.dataset.filter) return;
  const k = el.dataset.filter;
  if (k === "sort") S.f.sort = el.value;
  if (k === "ott") S.f.ott = el.checked;
  if (k === "tv") S.f.tv = el.checked;
  if (k === "prov") S.f.providers = el.checked ? S.f.providers.concat(el.value) : S.f.providers.filter(x => x !== el.value);
  if (k !== "price") renderResults();
});

  },
  ticket: async (f, btn) => {
    const d = { type: val(f, "type"), booking_id: val(f, "booking_id"), category: val(f, "category"), description: val(f, "description") }, e = {};
    if (d.type === "complaint" && !d.booking_id) e["tk-booking"] = "Choose the connection for a complaint.";
    if (d.description.length < 5) e["tk-desc"] = "Describe the issue in a few words.";
    if (!setErr(f, e)) return;
    const ref = await guard(btn, () => API.raiseTicket(d)); closeModal(); toast("Submitted. Ticket " + ref + "."); render();
  },
  "lead-status": async (f, btn) => {
    const d = { status: val(f, "status"), next: val(f, "next"), note: val(f, "note") }, e = {};
    if (d.status === "follow_up" && !d.next) e["ls-next"] = "Choose a follow-up date.";
    if (d.next && d.next < todayISO()) e["ls-next"] = "Choose today or a future date.";
    if (d.status === "lost" && d.note.length < 3) e["ls-note"] = "Add the reason the lead was lost.";
    if (!setErr(f, e)) return;
    await guard(btn, () => API.updateLeadStatus(f.dataset.id, d.status, d.note, d.status === "follow_up" ? d.next : null)); closeModal(); toast("Lead updated to " + LEAD[d.status] + "."); render();
  },
  book: async (f, btn) => {
    const date = val(f, "date"); if (!setErr(f, !date || date < todayISO() ? { "bk-date": "Choose today or a future date." } : {})) return;
    const ref = await guard(btn, () => API.createBooking(f.dataset.id, date)); closeModal(); toast("Booking " + ref + " created."); render();
  },
  "booking-status": async (f, btn) => {
    const s = val(f, "status"), ref = val(f, "ref"), ont = val(f, "ont"), e = {};
    if (s === "installed" && !ref) e["bs-ref"] = "Enter the connection reference.";
    if (ont && !/^[A-Za-z0-9-]{6,32}$/.test(ont)) e["bs-ont"] = "Serial should be 6–32 letters or digits.";
    if (!setErr(f, e)) return;
    await guard(btn, () => API.updateBookingStatus(f.dataset.id, s, ref, ont)); closeModal(); toast(s === "installed" ? "Installed. Commissions created for approval." : "Booking updated to " + BOOK[s] + "."); render();
  },
  "modem-wifi": async (f, btn) => {
    const ssid = val(f, "ssid"), pw = f.elements.password.value, e = {};
    if (!ssid && !pw) e["mw-ssid"] = "Enter a new name, a new password, or both.";
    else if (ssid && ssid === f.dataset.old) e["mw-ssid"] = "This is the current Wi-Fi name.";
    else if (ssid && !/^[\x20-\x7E]{1,32}$/.test(ssid)) e["mw-ssid"] = "Up to 32 English letters, digits or symbols.";
    if (pw && (pw.length < 8 || pw.length > 63)) e["mw-pw"] = "8 to 63 characters.";
    if (!setErr(f, e)) return;
    const d = await guard(btn, () => API.deviceAction(f.dataset.id, "wifi", { ssid, password: pw }));
    closeModal(); toast("Wi-Fi updated through GenieACS. Join " + (d && d.ssid ? d.ssid : "your Wi-Fi") + (pw ? " with the new password." : ".")); render();
  },
  acs: async (f, btn) => {
    const d = { mode: val(f, "mode"), url: val(f, "url"), key: f.elements.key ? f.elements.key.value.trim() : "", agreement: val(f, "agreement") }, e = {};
    if (d.mode === "partner" && !/^https?:\/\/\S+$/.test(d.url)) e["ac-url"] = "Enter the address, e.g. http://acs.partner.in:7557";
    if (d.mode && !d.agreement) e["ac-agree"] = "Get the written agreement from the partner first.";
    if (!setErr(f, e)) return;
    await guard(btn, () => API.saveAcs(f.dataset.id, d)); closeModal(); toast("ACS saved."); render();
  },
  "ticket-status": async (f, btn) => { const s = val(f, "status"), n = val(f, "note"); if (!setErr(f, ["resolved", "closed"].includes(s) && n.length < 3 ? { "ts-note": "Tell the customer what was done." } : {})) return; await guard(btn, () => API.updateTicket(f.dataset.id, s, n)); closeModal(); toast("Ticket updated."); render(); },
  assign: async (f, btn) => { const dsa = val(f, "dsa"), tip = val(f, "tip"); if (!setErr(f, !dsa && !tip ? { "as-dsa": "Choose a DSA or a TIP partner." } : {})) return; await guard(btn, () => API.assignLead(f.dataset.id, dsa, tip)); closeModal(); toast("Lead assigned."); render(); },
  partner: async (f, btn) => {
    const d = { id: f.dataset.id, type: val(f, "type"), name: val(f, "name"), firm: val(f, "firm"), phone: val(f, "phone"), email: val(f, "email"), commission_per_install: val(f, "commission_per_install"), service_pincodes: val(f, "service_pincodes"), kyc_verified: val(f, "kyc_verified"), lead_target: val(f, "lead_target") }, e = {};
    if (d.name.length < 2) e["pt-name"] = "Enter the name."; if (!isPhone(d.phone)) e["pt-phone"] = "Enter a valid 10-digit mobile."; if (!(Number(d.commission_per_install) >= 0)) e["pt-comm"] = "Enter 0 or more.";
    if (!setErr(f, e)) return; await guard(btn, () => API.savePartner(d)); closeModal(); toast("Partner saved."); render();
  },
  provider: async (f, btn) => { const d = { id: f.dataset.id, name: val(f, "name"), kind: val(f, "kind"), website: val(f, "website") }; if (!setErr(f, d.name.length < 2 ? { "pv-name": "Enter the provider name." } : {})) return; await guard(btn, () => API.saveProvider(d)); closeModal(); toast("Provider saved."); render(); },
  plan: async (f, btn) => { const d = planFormData(f); if (!setErr(f, planFormErrors(d))) return; await guard(btn, () => API.savePlan(d)); closeModal(); toast("Plan saved."); render(); },
  "tip-plan": async (f, btn) => { const d = planFormData(f); if (!setErr(f, planFormErrors(d))) return; const provs = await API.tipProviders();
    await guard(btn, () => API.tipSubmitPlans([planToRow(d, provs)])); closeModal(); toast("Sent to admin for review."); render(); },
  "activate-sim": async (f, btn) => { const r = val(f, "reference"), e = {}; if (r.length < 3) e["as-ref"] = "Enter the activation reference."; if (!val(f, "kyc")) e["as-kyc"] = "Confirm KYC is complete.";
    if (!setErr(f, e)) return; await guard(btn, () => API.dsaActivateSim(f.dataset.id, r)); closeModal(); toast("Activated. Payout created for approval."); render(); },
  "review-reject": async (f, btn) => { await guard(btn, () => API.adminReviewPlan(f.dataset.id, false, val(f, "note"))); closeModal(); toast("Submission rejected."); render(); },
  location: async (f, btn) => { const d = { pincode: val(f, "pincode"), area: val(f, "area"), zone: val(f, "zone") }, e = {}; if (!isPin(d.pincode)) e["lc-pin"] = "Enter a valid 6-digit PIN code."; if (d.area.length < 2) e["lc-area"] = "Enter the area."; if (!setErr(f, e)) return; await guard(btn, () => API.saveLocation(d)); closeModal(); toast("Location added."); render(); },
  coverage: async (f, btn) => { const d = { location_id: val(f, "location_id"), provider_id: val(f, "provider_id"), tip_partner_id: val(f, "tip_partner_id"), technology: val(f, "technology") }, e = {}; if (!d.location_id) e["cv-loc"] = "Choose the area."; if (!d.provider_id) e["cv-prov"] = "Choose the provider."; if (!setErr(f, e)) return; await guard(btn, () => API.saveCoverage(d)); closeModal(); toast("Coverage saved."); render(); },
  pay: async (f, btn) => { const ref = val(f, "reference"); if (!setErr(f, ref.length < 3 ? { "py-ref": "Enter the payment reference." } : {})) return; await guard(btn, () => API.recordPayment(f.dataset.id, f.dataset.ids.split(","), val(f, "method"), ref)); closeModal(); toast("Payment recorded."); render(); },
  "dsa-add": async (f, btn) => {
    const d = { name: val(f, "name"), phone: val(f, "phone"), pincode: val(f, "pincode"), area: val(f, "area"), address: val(f, "address"), plan_id: val(f, "plan_id"), consent: val(f, "consent") }, e = {};
    if (d.name.length < 2) e["dl-name"] = "Enter the customer's name."; if (!isPhone(d.phone)) e["dl-phone"] = "Enter a valid 10-digit mobile number."; if (!isPin(d.pincode)) e["dl-pin"] = "Enter a valid 6-digit PIN code."; if (!d.consent) e["dl-consent"] = "Customer consent is required.";
    if (!setErr(f, e)) return; const r = await guard(btn, () => API.dsaAddLead(d)); closeModal(); toast("Lead " + r.ref_code + " added" + (r.tip ? " · TIP: " + r.tip : "") + "."); S.dsaFilter = "open"; render();
  },
  "pay-charge": async (f, btn) => { const m = (f.querySelector("input[name=method]:checked") || {}).value || "upi"; btn.disabled = true; btn.textContent = "Processing payment…"; try { const c = await API.payCharge(f.dataset.id, m); paySuccess(c); } catch (e) { btn.disabled = false; btn.textContent = "Try again"; toast(errMsg(e), true); } },
  settings: async (f, btn) => { const d = { registration_fee_tip: val(f, "registration_fee_tip"), registration_fee_dsa: val(f, "registration_fee_dsa"), gst_percent: val(f, "gst_percent"), lead_target_default: val(f, "lead_target_default"), tip_share_percent: val(f, "tip_share_percent") }, e = {};
    if (!(Number(d.lead_target_default) >= 0) || d.lead_target_default === "") e["st-target"] = "Enter 0 or more."; if (!(Number(d.tip_share_percent) >= 0 && Number(d.tip_share_percent) <= 100) || d.tip_share_percent === "") e["st-share"] = "Enter 0 to 100.";
    if (!(Number(d.registration_fee_tip) >= 0) || d.registration_fee_tip === "") e["st-tip"] = "Enter 0 or more."; if (!(Number(d.registration_fee_dsa) >= 0) || d.registration_fee_dsa === "") e["st-dsa"] = "Enter 0 or more."; if (!(Number(d.gst_percent) >= 0 && Number(d.gst_percent) <= 28)) e["st-gst"] = "Enter 0 to 28.";
    if (!setErr(f, e)) return; await guard(btn, () => API.saveSettings(d)); toast("Fees saved."); },
  "new-charge": async (f, btn) => { const d = { payer_type: val(f, "payer_type"), partner_id: val(f, "partner_id"), customer_id: val(f, "customer_id"), kind: val(f, "kind"), description: val(f, "description"), base: val(f, "base") }, e = {};
    if (d.payer_type === "partner" && !d.partner_id) e["nc-partner"] = "Choose the partner."; if (d.payer_type === "customer" && !d.customer_id) e["nc-customer"] = "Choose the customer.";
    if (d.description.length < 3) e["nc-desc"] = "Add a description."; if (!(Number(d.base) > 0)) e["nc-amt"] = "Enter an amount.";
    if (!setErr(f, e)) return; await guard(btn, () => API.adminCreateCharge(d)); closeModal(); toast("Charge created and sent on WhatsApp."); render(); },
  "charge-offline": async (f, btn) => { const r = val(f, "reference"); if (!setErr(f, r.length >= 3 ? {} : { "co-ref": "Enter the reference." })) return; await guard(btn, () => API.adminSetCharge(f.dataset.id, "paid_offline", r)); closeModal(); toast("Marked as paid."); render(); },
  "otp-send": async (f, btn) => {
    const phone = val(f, "phone"); if (!setErr(f, isPhone(phone) ? {} : { "lg-phone": "Enter a valid 10-digit WhatsApp number." })) return;
    await guard(btn, () => API.sendOtp(phone)); openOtpStep(phone, f.dataset.purpose || "login");
  },
  "otp-verify": async (f, btn) => {
    const otp = val(f, "otp"); if (!setErr(f, /^\d{6}$/.test(otp) ? {} : { "lg-otp": "Enter the 6-digit OTP." })) return;
    const purpose = f.dataset.purpose, pend = S.pendingReq;
    let u;
    try { u = await guard(btn, () => API.verifyOtp(f.dataset.phone, otp, purpose === "request" && pend ? pend.name : "")); }
    catch (e) { setErr(f, { "lg-otp": errMsg(e) }); return; }
    clearInterval(otpTimer); try { localStorage.setItem("cb-session", u.id); } catch (e) {}
    renderHeader();
    if (purpose === "reset") { openSetPassword("reset"); return; }
    if (purpose === "request" && pend) { S.pendingReq = null; const r = await guard(null, () => API.requestConnection(pend)); showRequestDone(r, pend); return; }
    if (!u.full_name) { openModal(`<h2>Welcome to Connect Bhai</h2><p class="muted" style="margin:4px 0 14px">What should we call you?</p><form class="stack" data-form="set-name" novalidate>${field("nm-name", "Full name", `<input id="nm-name" name="name" autocomplete="name">`)}<button class="btn btn-primary" type="submit">Continue</button></form>`); return; }
    closeModal(); toast("Welcome, " + (u.role === "customer" ? u.full_name.split(" ")[0] : u.full_name) + "."); go(ROLE_HOME[u.role]);
  },
  "set-name": async (f, btn) => { const n = val(f, "name"); if (!setErr(f, n.length >= 2 ? {} : { "nm-name": "Enter your name." })) return; const u = await guard(btn, () => API.setMyName(n)); closeModal(); toast("Welcome, " + n.split(" ")[0] + "."); go(ROLE_HOME[u.role]); }
};
document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-form]"); if (!f) return; e.preventDefault();
  const fn = forms[f.dataset.form]; if (fn) Promise.resolve(fn(f, f.querySelector('[type="submit"]'))).catch(() => {});
});

/* ---------- boot ---------- */
(async function boot() {
  if (LIVE) { try { await API.init(); } catch (e) { toast("Could not connect to the server.", true); } }
  else { loadDemo(); let sid = null; try { sid = localStorage.getItem("cb-session"); } catch (e) {} if (sid) await API.restore(sid); }
  const h = (location.hash || "").replace("#", ""), [v, t] = h.split("-");
  if (["home", "speed", "router", "my", "dsa", "tip", "admin"].includes(v)) { S.view = v; S.tab = t || null; }
  renderHeader(); await render(); updateCompareBar();
})();


</script>

</body></html>
